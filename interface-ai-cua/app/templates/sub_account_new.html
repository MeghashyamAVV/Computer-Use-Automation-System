<html>
<head><title>CU-Console :: Open Sub-Account</title></head>
<body bgcolor="#e8e8e8">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr bgcolor="#003366">
    <td><font color="white" size="4"><b>&nbsp;CU-Console - Member Servicing</b></font></td>
  </tr>
</table>
<table width="500" cellpadding="10" cellspacing="0" border="1" align="center" bgcolor="white">
  <tr><td>
    <table cellpadding="4" cellspacing="0" border="0" width="100%">
      <tr><td colspan="2"><b>Open Sub-Account for {{ member.name }} ({{ member_id }})</b></td></tr>
      {% if error %}
      <tr><td colspan="2"><font color="red">{{ error }}</font></td></tr>
      {% endif %}
      <form method="post" action="/member/{{ member_id }}/sub-account/new">
      <tr>
        <td>Account Type:</td>
        <td>
          <label>Account Type
            <select name="account_type">
              <option value="youth_savings" {% if account_type == 'youth_savings' %}selected{% endif %}>Youth Savings</option>
              <option value="holiday_club" {% if account_type == 'holiday_club' %}selected{% endif %}>Holiday Club</option>
              <option value="money_market" {% if account_type == 'money_market' %}selected{% endif %}>Money Market</option>
            </select>
          </label>
        </td>
      </tr>
      <tr>
        <td>Initial Deposit ($):</td>
        <td><label>Initial Deposit <input type="text" name="initial_deposit" value="{{ initial_deposit }}"></label></td>
      </tr>
      <tr>
        <td colspan="2" align="right"><button type="submit">Continue</button></td>
      </tr>
      </form>
    </table>
  </td></tr>
</table>
</body>
</html>
