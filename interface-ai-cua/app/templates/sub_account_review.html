<html>
<head><title>CU-Console :: Review Sub-Account</title></head>
<body bgcolor="#e8e8e8">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr bgcolor="#003366">
    <td><font color="white" size="4"><b>&nbsp;CU-Console - Member Servicing</b></font></td>
  </tr>
</table>
<table width="500" cellpadding="10" cellspacing="0" border="1" align="center" bgcolor="white">
  <tr><td>
    <table cellpadding="4" cellspacing="0" border="0" width="100%">
      <tr><td colspan="2"><b>Review New Sub-Account</b></td></tr>
      <tr><td>Member:</td><td>{{ member.name }} ({{ member_id }})</td></tr>
      <tr><td>Account Type:</td><td>{{ account_type }}</td></tr>
      <tr><td>Initial Deposit:</td><td>${{ deposit }}</td></tr>
      <form method="post" action="/member/{{ member_id }}/sub-account/review">
        <input type="hidden" name="account_type" value="{{ account_type }}">
        <input type="hidden" name="deposit" value="{{ deposit }}">
        <tr><td colspan="2" align="right"><button type="submit">Confirm &amp; Open Account</button></td></tr>
      </form>
    </table>
  </td></tr>
</table>
</body>
</html>
