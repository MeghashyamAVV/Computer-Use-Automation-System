<html>
<head><title>CU-Console :: Sign In</title></head>
<body bgcolor="#e8e8e8">
<table width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr bgcolor="#003366">
    <td><font color="white" size="4"><b>&nbsp;CU-Console - Member Servicing</b></font></td>
  </tr>
</table>
<table width="400" cellpadding="10" cellspacing="0" border="1" align="center" bgcolor="white">
  <tr>
    <td>
      <table cellpadding="4" cellspacing="0" border="0">
        <tr><td colspan="2"><b>Operator Sign In</b></td></tr>
        {% if expired %}
        <tr><td colspan="2"><font color="red">Your session expired. Please sign in again.</font></td></tr>
        {% endif %}
        {% if error %}
        <tr><td colspan="2"><font color="red">{{ error }}</font></td></tr>
        {% endif %}
        <form method="post" action="/login">
        <tr>
          <td>Username:</td>
          <td><label>Username <input type="text" name="username"></label></td>
        </tr>
        <tr>
          <td>Password:</td>
          <td><label>Password <input type="password" name="password"></label></td>
        </tr>
        <tr>
          <td colspan="2" align="right"><button type="submit">Sign In</button></td>
        </tr>
        </form>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
